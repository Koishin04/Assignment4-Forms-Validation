
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5 mb-5">
        <h1>Registration Form</h1>

        <form id="registerForm" class="mt-4" novalidate>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" class="form-control"
                           id="firstName" required minlength="2">
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Enter your first name.</div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control"
                           id="lastName" required minlength="2">
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Enter your last name.</div>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control"
                       id="email" required>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Enter a valid email.</div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control"
                           id="password" required minlength="8">
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">
                        Password must be at least 8 characters.
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>
                    <input type="password" class="form-control"
                           id="confirmPassword" required minlength="8">
                    <div class="valid-feedback">Passwords match!</div>
                    <div class="invalid-feedback">
                        Passwords must match.
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Gender</label>

                <div class="form-check">
                    <input type="radio" class="form-check-input"
                           id="male" name="gender" value="male" required>
                    <label for="male" class="form-check-label">Male</label>
                </div>

                <div class="form-check">
                    <input type="radio" class="form-check-input"
                           id="female" name="gender" value="female" required>
                    <label for="female" class="form-check-label">Female</label>
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Select your gender.</div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Hobbies</label>

                <div class="form-check">
                    <input type="checkbox" class="form-check-input"
                           id="sports" name="hobbies" value="sports">
                    <label for="sports" class="form-check-label">Sports</label>
                </div>

                <div class="form-check">
                    <input type="checkbox" class="form-check-input"
                           id="music" name="hobbies" value="music">
                    <label for="music" class="form-check-label">Music</label>
                </div>

                <div class="form-check">
                    <input type="checkbox" class="form-check-input"
                           id="coding" name="hobbies" value="coding">
                    <label for="coding" class="form-check-label">Coding</label>
                </div>
            </div>

            <div class="mb-3">
                <label for="country" class="form-label">Country</label>
                <select class="form-select" id="country" required>
                    <option value="">Choose country</option>
                    <option value="kazakhstan">Kazakhstan</option>
                    <option value="usa">USA</option>
                    <option value="germany">Germany</option>
                    <option value="japan">Japan</option>
                </select>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Select your country.</div>
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
            <button type="reset" class="btn btn-secondary">Reset</button>
        </form>
    </div>

    <script>
        const form = document.getElementById("registerForm");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            if (password.value !== confirmPassword.value) {
                confirmPassword.setCustomValidity("Passwords do not match");
            } else {
                confirmPassword.setCustomValidity("");
            }

            const inputs = form.querySelectorAll("[required]");

            inputs.forEach(function(input) {
                input.classList.remove("is-valid", "is-invalid");

                if (input.checkValidity()) {
                    input.classList.add("is-valid");
                } else {
                    input.classList.add("is-invalid");
                }
            });
        });

        form.addEventListener("reset", function() {
            confirmPassword.setCustomValidity("");

            const inputs = form.querySelectorAll(".is-valid, .is-invalid");

            inputs.forEach(function(input) {
                input.classList.remove("is-valid", "is-invalid");
            });
        });
    </script>
</body>
</html>
